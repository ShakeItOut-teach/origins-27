name: CI

on:
  pull_request:
  push:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Frontières d'architecture
        run: pnpm boundaries
      - name: Tests
        run: pnpm test
      - name: Construction du client
        run: pnpm build
      - name: Assemblage du serveur
        run: pnpm server:bundle
      - name: Essai de la fonction du serveur
        run: pnpm server:try
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: packages/client/dist
          retention-days: 7

  database:
    name: Base de données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Par npx plutôt que par supabase/setup-cli, qui échoue quand GitHub limite ses appels.
      - name: Base vide, migrations rejouées
        run: npx --yes supabase@2 db start
      - name: Règles d'accès et écritures
        # En cas d'échec, l'erreur devient une annotation : lisible sans se connecter à GitHub.
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f supabase/tests/acces.sql 2> erreurs.txt || {
            cat erreurs.txt
            echo "::error title=Base de données::$(tr '\n' ' ' < erreurs.txt)"
            exit 1
          }

  deploy:
    name: Mise en ligne (préproduction)
    needs: [check, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets Cloudflare présents ?
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Mise en ligne sautée : ajouter les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID au dépôt."
          fi
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: site
          path: dist
      - name: Créer le projet Cloudflare Pages s'il n'existe pas
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages project create origins-27 --production-branch=main || true
      - name: Envoyer le site
        if: steps.secrets.outputs.ready == 'true'
        # Cloudflare limite parfois les appels : on réessaie après une pause.
        run: |
          for essai in 1 2 3 4; do
            if npx --yes wrangler@4 pages deploy dist --project-name=origins-27 --branch=next --commit-dirty=true; then exit 0; fi
            echo "Essai $essai échoué, nouvelle tentative dans 90 secondes."
            sleep 90
          done
          exit 1

  deploy-server:
    name: Mise en ligne du serveur (Supabase)
    needs: [check, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Identifiant public du projet (il figure déjà dans l'adresse du serveur).
      SUPABASE_PROJECT: dzotlvwbmjiqyfiymmlz
    steps:
      - name: Secrets Supabase présents ?
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Serveur non déployé : ajouter les secrets SUPABASE_ACCESS_TOKEN et SUPABASE_DB_PASSWORD au dépôt."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Assembler le serveur
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile && pnpm server:bundle
      - name: Relier le projet
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes supabase@2 link --project-ref "$SUPABASE_PROJECT"
      - name: Appliquer les migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes supabase@2 db push --linked
      - name: Déployer la fonction du jeu
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes supabase@2 functions deploy jeu --project-ref "$SUPABASE_PROJECT" --use-api
      - name: La fonction répond et refuse un inconnu
        if: steps.secrets.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://$SUPABASE_PROJECT.supabase.co/functions/v1/jeu/etat")
          echo "Réponse sans jeton : $code"
          test "$code" = "401"
      # Le lien reçu par e-mail ne peut ramener le joueur que vers une adresse autorisée.
      # On ajoute celles du jeu sans toucher à celles déjà présentes.
      - name: Autoriser l'adresse du site pour les liens par e-mail
        if: steps.secrets.outputs.ready == 'true'
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT/config/auth"
          list=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api" | jq -r '.uri_allow_list // ""')
          wanted="$list"
          for site in "https://next.origins-27.pages.dev" "https://origins-27.pages.dev"; do
            case ",$wanted," in
              *",$site,"*) ;;
              *) wanted="${wanted:+$wanted,}$site" ;;
            esac
          done
          if [ "$wanted" = "$list" ]; then
            echo "Adresses déjà autorisées."
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg list "$wanted" '{uri_allow_list: $list}')")
            echo "Mise à jour des adresses autorisées : $code"
            test "$code" = "200"
          fi
