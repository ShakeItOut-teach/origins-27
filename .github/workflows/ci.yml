name: CI

on:
  pull_request:
  push:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Frontières d'architecture
        run: pnpm boundaries
      - name: Tests
        run: pnpm test
