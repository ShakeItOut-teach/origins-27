<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origins 27 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Les abysses : un seul monde sombre. Application plein écran : barre du haut, ressources, une vue à la fois, navigation permanente. */
:root{
  --abyss:#03080f;
  --deep:#071420;
  --panel:#0a1b29;
  --line:#173349;
  --text:#d6e5ec;
  --muted:#7e97a7;
  --lume:#5ee6d0;
  --atp:#ffe07a;
  --prot:#f3b562;
  --lip:#ef7fa6;
  --nuc:#a99bff;
  --bad:#ff8a7a;
  --t-tox:#b8e05a;--t-pha:#4fc3f7;--t-par:#c77dff;--t-enz:#ff9e6b;--t-har:#e3e9ee;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--abyss);color:var(--text);font:14px/1.45 var(--font-body);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lume);outline-offset:2px}
p{margin:0}
header{display:flex;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(var(--deep),var(--abyss));flex-wrap:wrap}
h1{font:700 21px/1 var(--font-display);margin:0;white-space:nowrap}
h1 small{font:500 11px var(--font-mono);color:var(--muted);margin-left:8px;letter-spacing:.06em}
h2{font:700 16px/1.2 var(--font-display);margin:0 0 8px;text-wrap:balance}
h3{font:600 12px/1.3 var(--font-body);margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.souche-chip{font-size:12px;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600}
.clock{font:500 13px var(--font-mono);color:var(--lume);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 9px;font:500 12px var(--font-mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--text)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted)}
.ghost.arm{border-color:var(--bad);color:var(--bad)}
.resbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line);flex:none}
.res{background:var(--deep);padding:7px 14px;display:flex;flex-direction:column;gap:0;cursor:help}
.res .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:6px}
.res .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle;flex:none}
.res .k img.spr{margin:-3px 0}
.dart img.spr{max-width:none}
.em .emi{float:left;margin:0 8px 4px 0}
.wildic{display:flex;align-items:center;gap:8px}
.res .v{font:500 17px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.res .v small{font-size:11px;color:var(--muted)}
.res .r{font:12px var(--font-mono);color:var(--lume)}
.res .r.neg{color:var(--bad)}
.res.full .v{color:var(--bad)}
.strip{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;padding:6px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none;cursor:pointer;background:var(--abyss)}
.strip b{color:var(--text);font-weight:500}
.goal{background:rgba(94,230,208,.1);border:1px solid var(--lume);border-radius:999px;padding:3px 10px;color:var(--text);font-size:12.5px;text-align:left}
.goal span{font:500 11px var(--font-mono);color:var(--lume)}
.strip .pb{display:inline-block;width:46px;height:4px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle;margin:0 4px}
.strip .pb i{display:block;height:100%;width:0;background:var(--lume)}
.strip .pb.evo i{background:var(--nuc)}
nav.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);flex:none;background:var(--abyss)}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:-1px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:20px;height:20px;display:none}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--lume)}
nav.tabs .badge{font:500 10px var(--font-mono);color:var(--muted)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0}
.viewarea{position:relative;min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.viewarea.scroll{overflow:auto;align-items:flex-start}
.depthtag{position:absolute;left:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:2px;padding:6px 9px;background:rgba(3,8,15,.72);border:1px solid var(--line);font:11px var(--font-mono);color:var(--muted)}
.depthtag b{font:600 12px var(--font-body);color:var(--text)}
.depthtag .lbar{display:block;width:96px;height:4px;background:#0a1b29;margin:2px 0}
.depthtag .lbar i{display:block;height:100%;background:#ffe9a8}
.viewarea > svg{width:100%;height:100%;display:block}
aside{border-left:1px solid var(--line);overflow:auto;padding:14px;background:var(--deep);min-height:0}
.sheet-close{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.muted{color:var(--muted)}
.cost{display:flex;flex-wrap:wrap;gap:4px 12px;font:12px var(--font-mono);font-variant-numeric:tabular-nums;margin:6px 0}
.cost span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px;background:currentColor}
.c-atp{color:var(--atp)}.c-prot{color:var(--prot)}.c-lip{color:var(--lip)}.c-nuc{color:var(--nuc)}
.btn{background:var(--lume);color:#04211c;border:0;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.alt{background:transparent;border:1px solid var(--lume);color:var(--lume)}
.btn.alt:disabled{border-color:var(--line);color:var(--muted);background:transparent}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.reason{font-size:12px;color:var(--bad);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
.stat b{font:500 13px var(--font-mono);text-align:right}
.up{color:var(--lume)}
.choice{border-top:1px solid var(--line);padding:10px 0}
.choice:first-of-type{border-top:0}
.choice .n{font-weight:600}
.req{font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.lnk{background:transparent;border:0;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.lnk.ok{color:var(--lume)}.lnk.no{color:var(--bad)}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.fx{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
.fx li{padding:2px 0}
.fx li.good::before{content:"+ ";color:var(--lume)}
.fx li.badfx::before{content:"− ";color:var(--bad)}
.stepper{display:flex;align-items:center;gap:6px;margin:8px 0}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--deep);font-weight:600}
.stepper b{font:500 15px var(--font-mono);min-width:34px;text-align:center}
.actbar{position:sticky;bottom:-14px;margin:12px -14px -14px;padding:10px 14px 14px;background:var(--deep);border-top:1px solid var(--line);z-index:2;box-shadow:0 -10px 16px rgba(3,8,15,.6)}
.abh{display:flex;justify-content:space-between;gap:8px;font:600 12px var(--font-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.abh span:last-child{font:500 12px var(--font-mono);text-transform:none;letter-spacing:0}
.actbar .stepper{margin:6px 0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.choice.off .n{color:var(--muted)}
.cost .dur{color:var(--muted)}
.cost .dur::before{display:none}
span.sm{display:none}
.mtree{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.mtabs{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.mtabs button{background:transparent;border:0;padding:9px 2px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative}
.mtabs button[aria-pressed="true"]{background:var(--line);color:var(--text)}
.mtabs i{font:500 10px var(--font-mono);font-style:normal;background:var(--lume);color:#04211c;border-radius:999px;padding:0 5px;margin-left:4px;vertical-align:1px}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mrow.one{grid-template-columns:minmax(0,62%);justify-content:center}
.mrow.links{height:12px}
.mrow.links .mlink{height:12px}
.mlink{width:2px;height:12px;background:var(--line);margin:0 auto}
.mnode{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;text-align:center}
.mnode b{font-size:13.5px;font-weight:600}
.mnode span{font:10.5px var(--font-mono);color:var(--muted)}
.mnode.st-owned{border-color:var(--tc,var(--lume));background:rgba(94,230,208,.12)}
.mnode.st-owned b{color:var(--tc,var(--lume))}
.mnode.st-open{border-color:var(--tc,var(--lume))}
.mnode.st-research{border-color:var(--nuc)}
.mnode.st-closed{opacity:.35}
.mnode.st-locked{opacity:.7}
.mnode.st-hidden{border-style:dashed}
.mnode.sel{outline:2px solid #fff;outline-offset:1px}
.mwheel svg{width:100%;max-height:270px;display:block;margin:0 auto}
.mnote{font-size:11.5px;color:var(--muted);text-align:center;letter-spacing:.02em}
.typechip{display:inline-block;font:500 11px var(--font-mono);padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.activity{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.mv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.mv:first-of-type{border-top:0}
.mv .t{font-weight:600}
.mv .s{font:12px var(--font-mono);color:var(--muted);grid-column:1/2}
.log{list-style:none;margin:0;padding:0;font-size:12.5px}
.log li{padding:4px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.log li time{font:11px var(--font-mono);color:var(--muted);white-space:nowrap;padding-top:2px}
.log li.good span{color:var(--lume)}
.log li.rare span{color:var(--nuc)}
.log li.bad span{color:var(--bad)}
.win{border:1px solid var(--lume);background:rgba(94,230,208,.08);border-radius:12px;padding:14px;margin-bottom:12px}
.win h2{color:var(--lume)}
.treebox{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.treebox svg{width:100%;max-width:960px;min-width:680px;height:auto}
.emerg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:960px;min-width:300px}
.em{border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:12.5px}
.em b{display:block;font-family:var(--font-display);font-size:14px;margin-bottom:3px}
.em.got{border:1px solid var(--nuc);background:rgba(169,155,255,.08)}
.em.got b{color:var(--nuc)}
.frisson{font-size:13px;color:var(--nuc);text-align:center}
canvas{display:block;border-radius:12px;border:1px solid var(--line);background:#02060b;touch-action:manipulation;cursor:crosshair}
/* SVG */
.hit{cursor:pointer}
.hit:focus-visible .ring{stroke-opacity:1}
@media (hover:hover){.hit:hover .ring{stroke-opacity:1}}
.ring{fill:none;stroke:#5ee6d0;stroke-opacity:0;stroke-width:2}
.sel .ring{stroke-opacity:1}
.busy{fill:none;stroke:#ffe07a;stroke-width:2;stroke-dasharray:6 6;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.svgl{font:600 12px var(--font-body);fill:#d6e5ec}
.svgs{font:500 10.5px var(--font-mono);fill:#7e97a7}
/* Bulle d’aide */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;background:#0e2536;border:1px solid var(--lume);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{display:block;font-weight:600;margin-bottom:2px}
#tip .m{color:var(--muted)}
/* Fenêtre d’avancée */
#modal{position:fixed;inset:0;z-index:25;background:rgba(2,6,11,.78);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
.incw{color:var(--bad);cursor:pointer;font-weight:600}
.incard{border-color:var(--bad)}
table.rank{width:100%;border-collapse:collapse;font-size:13px}
table.rank td,table.rank th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.rank .num{text-align:right;font-family:var(--font-mono)}
table.rank tr.me td{background:rgba(94,230,208,.12);color:var(--lume);font-weight:600}

.cost span.short{color:var(--bad)}.cost span.short::before{background:var(--bad)}
.cost .miss{font-style:normal;color:var(--bad)}
.btn.lack{opacity:.55;border-style:dashed}
.pop.adv{text-align:left;max-width:440px;max-height:88vh;overflow:auto}
.pop.adv .kick,.pop.adv h2{text-align:center}
.lackrow{display:flex;justify-content:center;gap:18px;margin:10px 0 4px;flex-wrap:wrap}
.lack{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.lack b{font:600 15px var(--font-mono)}
.advh{display:flex;align-items:center;gap:6px;font-size:14px;margin:12px 0 4px}
.advpath{list-style:none;margin:0;padding:0;counter-reset:st}
.advpath li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.advpath li .advt{flex:1}
.advpath li .btn{flex:none;white-space:nowrap;display:inline-block}
.advdot{width:16px;height:16px;flex:none;border-radius:50%;border:1px solid var(--muted)}
.advwild{display:flex;justify-content:center;margin:8px 0}
.pop.adv>.btn{display:block;margin:14px auto 0}
.pop.adv .row{margin-top:14px;gap:8px}

.pop{background:var(--panel);border:1px solid var(--nuc);border-radius:16px;max-width:400px;width:100%;padding:18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pop .kick{font:500 11px var(--font-mono);letter-spacing:.12em;color:var(--nuc);text-transform:uppercase}
.pop h2{font-size:22px;margin:6px 0 4px}
.pop svg{width:190px;height:190px;margin:4px auto 6px;display:block}
.pop .fx{text-align:left;display:inline-block}
.pop .btn{margin-top:14px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#0e2536;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:fade 3.4s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
/* Choix de souche */
.picker{position:fixed;inset:0;background:rgba(2,6,11,.97);overflow:auto;z-index:40;padding:24px 18px}
.picker-in{max-width:1080px;margin:0 auto}
.picker h2{font-size:26px;margin-bottom:6px}
.picker .lead{color:var(--muted);max-width:62ch;margin-bottom:18px}
.strains{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.strain{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.strain h3{margin:0;font:700 18px var(--font-display);color:var(--text);text-transform:none;letter-spacing:0}
.strain .origin{font-size:13px;color:var(--muted);font-style:italic}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lume)}
.strain ul{margin:0;padding:0;list-style:none;font-size:13px}
.strain li.b::before{content:"+ ";color:var(--lume)}
.strain li.m::before{content:"− ";color:var(--bad)}
.strain li.t{color:var(--nuc)}
.strain .btn{margin-top:auto;align-self:flex-start}
.fictif{font-size:12px;color:var(--muted);margin-top:16px}
.intro{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%;justify-content:center}
.intro .kicker{font:500 12px var(--font-mono);letter-spacing:.14em;color:var(--lume);text-transform:uppercase}
.intro h2{font-size:30px;margin:0;line-height:1.1}
.intro .art{display:flex;align-items:center;justify-content:center;width:100%;max-width:560px;aspect-ratio:36/22;align-self:center;border-radius:16px;border:1px solid var(--line);background:#02060b;overflow:hidden}
.intro .art svg{width:100%;height:100%;display:block}
.intro .txt{font-size:15.5px;line-height:1.55;max-width:62ch}
.intro .txt p+p{margin-top:8px}
.timeline{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.timeline span{font:500 11px var(--font-mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.timeline span.on{border-color:var(--lume);color:var(--lume)}
.intro-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--lume)}
.statlegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13px}
.statlegend div b{display:block;font-weight:600}
.statlegend div span{color:var(--muted)}
.strain .portrait{display:flex;align-items:center;justify-content:center;height:120px;border-radius:10px;background:#02060b;border:1px solid var(--line);overflow:hidden}
.strain .portrait svg{width:100%;height:100%;display:block}
.bars .lbl{white-space:nowrap}
/* Téléphone : navigation en bas, fiche en volet */
@media (max-width:820px){
  header{padding:8px 12px;gap:6px 10px}
  h1{font-size:18px}h1 small{display:none}
  .souche-chip{display:none}
  .res{padding:5px 8px}
  .res .k{font-size:10px;letter-spacing:.04em}
  .res .v{font-size:14px}.res .v small{display:none}
  .res .r{font-size:11px}
  .strip{padding:5px 12px;font-size:12px;gap:4px 12px}
  nav.tabs{order:10;padding:0;border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;padding:7px 2px 6px;font-size:11px;border-bottom:0;border-top:2px solid transparent;margin:0}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--lume)}
  nav.tabs button svg{display:block}
  main{grid-template-columns:1fr}
  .viewarea{padding:6px}

function applyLoss(M,lost){const tot=M.n||1,ks=Object.keys(M.u).filter(k=>M.u[k]>0).sort((a,b)=>UNITS[a].atk-UNITS[b].atk),rm={};let left=lost;
  ks.forEach(k=>{rm[k]=Math.min(M.u[k],Math.floor(lost*M.u[k]/tot));left-=rm[k];});
  for(const k of ks){if(left<=0)break;const t=Math.min(M.u[k]-rm[k],left);rm[k]+=t;left-=t;}
  for(const k in rm)M.u[k]-=rm[k];M.n=uSum(M.u);return rm;}

function newGame(seed,souche){

    const cel=[];[[0,0,"nuc"],[1,0,"prot"],[-1,0,"prot"],[0,1,"nuc"],[0,-1,"prot"]].forEach(d=>{const x=sx+d[0],y=sy+d[1];if(ok(x,y)){put(x,y,d[2],2200+Math.round(cen(x,y)*60),true);cel.push([x,y]);}});
    if(ci===0)src=cel;});
  const wildAt=(x,y,type,easy)=>{const cc=cen(x,y),mx=Math.round(200+cc*20);tiles[y*W+x].w={type,def:easy?28:Math.round(20+cc*4+rng()*15),bio:mx,max:mx,mb:mx};};
  for(let i=0;i<5;i++){const c=ring(3,9,stx,sty);if(c.length){const p=pick(c);wildAt(p[0],p[1],TYPE_ORDER[i]);}}
  for(let i=0;i<Math.round(215*AREA_F);i++){const x=Math.floor(rng()*W),y=Math.floor(rng()*H);if(!ok(x,y)||tiles[y*W+x].k||tiles[y*W+x].w||dist(x,y)<3)continue;wildAt(x,y,pick(TYPE_ORDER));}
  const cand=Object.keys(NODES).filter(k=>NODES[k].tier===2||NODES[k].tier===3),pairs=[],used=new Set();

function mods(){
  const m={};for(const k in MOD_LABEL)m[k]=0;
  const add=o=>{for(const k in o)m[k]=(m[k]||0)+o[k];};
  add(SOUCHES[S.souche].mods);
  S.nodes.forEach(id=>{add(scaledEff(id,glvl(id)));add(NODES[id].mal);});
  S.emerg.forEach(id=>add(EMERG.find(e=>e.id===id).eff));
  (S.muts||[]).forEach(id=>{const u=MUT_BY[id];if(u){add(u.eff);add(u.mal);}});
  lineages().forEach(t=>add(LINEAGE[t].eff));
  if(S.ally)m.fieldPct+=0.05;
  return m;
}

function rates(){
  const m=mods(),fp=1+m.fieldPct,o={},fil={atp:0,prot:0,lip:0,nuc:0};
  S.fils.forEach(f=>{const T=S.tiles[f.y*W+f.x];if(T.k)fil[T.k]+=filRate(T,m);});
  const base={atp:6,prot:9,lip:6,nuc:3.5};

  for(const k of RES){const fs=S.fields.reduce((a,f)=>f.k===k?a+fieldProd(f.l):a,0);o[k]=(Math.max(0,(base[k]+fs*fp)*prodMult(k,m))+fil[k])*ax*PROD_F;}
  o.fil=fil;

function fightTable(u0,lostBy,wtype,hp,pw,def,win,defLabel){

  UNIT_ORDER.forEach(k=>{const c=u0[k];if(!c)return;const U=UNITS[k],f=unitF(k,wtype),ctr=c*U.atk*f*pp,l=lostBy[k]||0;

  const r=pw*ATK_ADV/Math.max(1,def),lost=uSum(lostBy),sent=uSum(u0);
  let h='<table class="ftab"><thead><tr><th>Vos troupes</th><th class="num">⚔ / u.</th><th class="num">Voie</th><th class="num">Force</th><th class="num">Pertes</th></tr></thead><tbody>'+rows+"</tbody>";
  h+='<tfoot><tr><td>Total'+(m.predPct?' <span class="muted">(prédation '+(m.predPct>0?"+":"")+Math.round(m.predPct*100)+" %)</span>":"")+'</td><td></td><td></td><td class="num"><b>'+fmt(pw)+'</b></td><td class="num">'+lost+"/"+sent+"</td></tr></tfoot></table>";
  h+='<div class="fbar"><i style="width:'+Math.round(Math.min(100,pw/(pw+def)*100))+'%"></i><span>Vous '+fmt(pw)+"</span><span>"+defLabel+" "+fmt(def)+"</span></div>";
  let why;
  if(win)why=r>=2?"Victoire écrasante : vous étiez "+r.toFixed(1).replace(".",",")+" fois plus fort, les pertes sont minimes.":r>=1.3?"Net avantage (×"+r.toFixed(2).replace(".",",")+") : pertes modérées.":"Victoire de justesse (×"+r.toFixed(2).replace(".",",")+") : à force presque égale, on saigne beaucoup. Ajoutez des troupes pour perdre moins.";
  else{const miss=Math.max(1,Math.ceil(def/ATK_ADV-pw)),best=UNIT_ORDER.filter(k=>uReq(k)).sort((a,b)=>UNITS[b].atk*unitF(b,wtype)-UNITS[a].atk*unitF(a,wtype))[0],per=best?UNITS[best].atk*unitF(best,wtype)*pp:10;
    why="Défaite : il manquait <b>"+fmt(miss)+"</b> de force (vous aviez "+Math.round(r*100)+" % de ce qu’il fallait)."+(best?" Soit environ <b>"+Math.ceil(miss/per)+" "+UNITS[best].pl.toLowerCase()+"</b> de plus.":"")+" En cas de défaite, on perd au moins la moitié des troupes.";}

function huntAdvice(n,w,hp,withHero){
  const per=10*(1+mods().predPct)*matchup(w.type).f,mt=matchup(w.type),need=Math.max(1,Math.ceil((w.def/ATK_ADV-hp)/Math.max(0.1,per))),out=[];
  if(n<need)out.push("Envoyez plus de collectrices : il en fallait au moins <b>"+need+"</b> ici (vous : "+n+"). Produisez-en dans les ribosomes.");
  if(!ownedTypes().length)out.push("Aucune voie offensive : exprimez une voie de rang 3 en Prédation, elle double votre force contre la bonne cible.");
  else if(mt.f<1)out.push("Votre voie est <b>faible</b> contre "+WILD_NAME[w.type]+" : visez plutôt ce que vous battez sur la roue.");
  if(!withHero)out.push("Emmenez votre héros : il ajoute sa force et ne meurt jamais.");
  if(glvl("P1")<3||!has("P2"))out.push("Améliorez Pili adhésifs et exprimez Vésicules d’attaque : plus de force par collectrice.");
  return out;
}

/* Liens vers l’endroit où agir */
function refFor(q){
  const t=q[0],k=q[1];
  if(t==="f"){let bi=0,bl=-1;S.fields.forEach((f,i)=>{if(f.k===k&&f.l>bl){bl=f.l;bi=i;}});return "field:"+bi;}
  if(k==="noyau")return "noyau";
  const i=S.slots.findIndex(s=>s&&s.k===k);if(i>=0)return "slot:"+i;

}

function heroGain(w,win,pvp){
  const H=S.hero,xp=Math.max(1,Math.round(w.def*(win?1:0.4)*(pvp?1:PVE_RATIO))),tk=TYPE_TRAIT[w.type],tl0=traitLevel(tk);
  H.xp+=xp;H.fights++;if(win)H.wins++;H.tp[tk]+=win?0.3:0.1;
  let msg="Héros : +"+xp+" XP ("+(pvp?"combat entre joueurs : XP complète":"combat PvE, 1/10 d’un combat entre joueurs")+"), trait "+TRAITS[tk].name+" renforcé.";
  if(traitLevel(tk)>tl0)msg+=" "+TRAITS[tk].name+" passe au niveau "+traitLevel(tk)+".";
  while(H.xp>=xpNeed(H.lvl)){H.xp-=xpNeed(H.lvl);H.lvl++;log("Votre héros passe au niveau "+H.lvl+".","good");popup({grp:"herolvl",kick:"Héros",title:"Niveau "+H.lvl,body:"<p>Votre héros gagne en force : "+heroBase()+" de base au combat.</p>",hero:1});}
  const f=heroForm();if(f!==H.form){H.form=f;if(H.seen.indexOf(f)<0)H.seen.push(f);log("Votre héros prend la forme : "+f+".","rare");const pr=heroPair();popup({kick:"Métamorphose du héros",title:f,body:"<p>Ses combats ont façonné son corps : "+pr.map(k=>TRAITS[k].name.toLowerCase()).join(" et ")+".</p>"+formStrengthHTML(),hero:1});}
  return msg;
}
function formStrengthHTML(){const pr=heroPair();if(!pr.length)return '<p class="desc">Encore une larve : pas de forces ni de faiblesses marquées.</p>';const st=pr.map(k=>BEATS[TRAITS[k].from]),wk=pr.map(k=>LOSES_TO[TRAITS[k].from]);return '<p class="desc">Fort contre '+[...new Set(st)].map(t=>WILD_NAME[t]).join(", ")+" (+30 %). Faible contre "+[...new Set(wk)].map(t=>WILD_NAME[t]).join(", ")+" (−25 %).</p>";}
function spawnWild(){const near=Math.random()<0.6,c=cpos();for(let g=0;g<300;g++){let x,y;if(near){const a=Math.random()*Math.PI*2,r=4+Math.random()*10;x=Math.round(c[0]+Math.cos(a)*r);y=Math.round(c[1]+Math.sin(a)*r);if(x<0||y<0||x>=W||y>=H)continue;}else{x=Math.floor(Math.random()*W);y=Math.floor(Math.random()*H);}if(!inWorld(x,y)||isLand(x,y))continue;const T=S.tiles[y*W+x];if(T.k||T.w||dist(x,y)<4||botAt(x,y))continue;const r=rC(x,y),type=TYPE_ORDER[Math.floor(Math.random()*5)],mx=Math.round(200+cen(x,y)*20);T.w={type,def:Math.round(20+cen(x,y)*4+Math.random()*15),bio:mx,max:mx,mb:mx};return;}}
function migRange(){return 4+2*blvl("flag")+Math.max(0,mods().rangeAdd);}
function migCost(d){return {atp:Math.round(60*d),lip:Math.round(40*d),prot:Math.round(30*d)};}
function migTime(d){return TIME_F*20*d/(1+0.3*blvl("flag"))/Math.max(0.3,1+mods().speedPct);}
function migBlock(x,y){const T=S.tiles[y*W+x],d=dist(x,y);if(!inWorld(x,y))return "C’est de la roche.";if(isLand(x,y))return "Terre ferme : votre lignée devra évoluer avant d’y vivre.";if(botAt(x,y))return "Case occupée par un rival.";if(S.mig)return "Une migration est déjà en cours.";if(!T.s)return "Case inconnue : explorez-la d’abord.";if(T.k||T.w)return "Il faut une case d’eau libre.";if(d>migRange())return "Trop loin pour migrer (portée "+migRange()+" cases, augmentez le flagelle).";if(S.missions.length)return "Rappelez d’abord vos collectrices en mission.";return capBlock(migCost(d));}
function lvlCost(id,L){const n=NODES[id],f=Math.max(0.3,1+mods().evoCost),g=Math.pow(1.45,L-1)*costF(L+(n.tier||0));return {nuc:Math.round(n.cost*0.8*g*f),atp:Math.round(n.cost*0.4*g)};}
function lvlTime(id,L){return TIME_F*NODES[id].time*0.6*Math.pow(1.35,L-1)/(1+0.05*S.noyau);}
function lvlBlock(id){if(!has(id))return "Gène non exprimé.";const L=glvl(id);if(L>=maxLvl(id))return "Niveau maximum atteint.";if(S.research)return "Un gène est déjà en cours d’expression.";return capBlock(lvlCost(id,L));}
function fmt(n){return Math.floor(n).toLocaleString("fr-FR");}
function fmtDur(min){min=Math.max(0,min);if(min<1)return Math.max(1,Math.ceil(min*60))+" s";if(min<60)return Math.ceil(min)+" min";const h=Math.floor(min/60),m=Math.min(59,Math.ceil(min%60));return h+" h "+String(m).padStart(2,"0");}
function fmtClock(t){const d=Math.floor(t/1440)+1,h=Math.floor((t%1440)/60),m=Math.floor(t%60);return "Jour "+d+" · "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");}
function fmtMod(k,v){if(k==="revealSource")return MOD_LABEL[k];if(k==="photoPct")return "photosynthèse ×"+(Math.round(v*10)/10)+" (selon la lumière : aujourd’hui +"+Math.round(v*photoF()*100)+" % d’ATP)";if(k==="filAdd")return "filaments +"+v;const add=k==="rangeAdd"||k==="visionAdd";const s=v>0?"+":"−";const val=add?Math.abs(v)+" case"+(Math.abs(v)>1?"s":""):Math.round(Math.abs(v)*100)+" %";return MOD_LABEL[k]+" "+s+val;}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function updateVision(){const r=visR()+0.45,c=cpos(),R=Math.ceil(r);for(let y=Math.max(0,c[1]-R);y<=Math.min(H-1,c[1]+R);y++)for(let x=Math.max(0,c[0]-R);x<=Math.min(W-1,c[0]+R);x++){if(dist(x,y)<=r){const T=S.tiles[y*W+x];if(!T.s)dirty=true;T.s=1;T.m=T.a;if(T.w)T.w.mb=T.w.bio;}}S.fils.forEach(f=>{const T=S.tiles[f.y*W+f.x];T.s=1;T.m=T.a;});}

function frissonInfo(){const pend=[],lost=[];S.emPairs.forEach((p,i)=>{if(hasEm(EMERG[i].id))return;const a=has(p[0]),b=has(p[1]);if(a===b)return;const miss=a?p[1]:p[0],st=nodeState(miss);if(st==="closed")lost.push(miss);else pend.push(BRANCH[NODES[miss].br]);});return {pend,lost};}

function step(dm){
  enStep();stashStep();const r=rates(),u=upkeep(),m=mods();let short=null;
  for(const k of RES){
    const net=r[k]-u[k];let v=S.res[k];
    if(net>0){if(v<r.cap)v=Math.min(r.cap,v+net*dm/60);}else v=Math.max(0,v+net*dm/60);
    const pa=protectedAmt();if(v>pa)v-=(v-pa)*SPOIL*dm/60;
    if(v<=0.5&&net<0)short=k;S.res[k]=v;
  }
  S.fils.forEach(f=>{const T=S.tiles[f.y*W+f.x];if(T.k)T.a=Math.max(0,T.a-filRate(T,m)*dm/60);});
  for(const T of S.tiles){if(T.max&&T.a<T.max)T.a=Math.min(T.max,T.a+T.max*0.015*dm/60);if(T.w&&T.w.bio<T.w.max)T.w.bio=Math.min(T.w.max,T.w.bio+T.w.max*0.02*dm/60);}
  S.wildT=(S.wildT||0)+dm;if(S.wildT>=90){S.wildT=0;let c=0;for(const T of S.tiles)if(T.w)c++;if(c<220*AREA_F)spawnWild();}

    else if(b.type==="new"){S.slots[b.i]={k:b.k,l:1};log(BLD[b.k].name+" construit.","good");popup({kick:"Nouvel organite",title:BLD[b.k].name,body:"<p>"+BLD[b.k].role+"</p>",org:b.k});}

      if(M.kind==="raid")raidArrive(M);
      else if(M.kind==="hunt"&&!T.w){M.result="none";report("combat","Proie disparue · case "+M.x+","+M.y,["Il n’y avait plus rien à chasser à l’arrivée : un autre raid l’avait déjà dévorée."],null);}
      else if(M.kind==="hunt"&&T.w){

        if(win){const cap0=compCarry(M.u)*2.5+hp,take=Math.min(w.bio,cap0),tot=take*(1+m.lootPct);M.cargo={prot:Math.round(tot*.5),nuc:Math.round(tot*.25),lip:Math.round(tot*.15),atp:Math.round(tot*.3)};if(w.boss)bossDown(M.x,M.y,w);T.w=null;M.result="win";
          lines.push("<b>Butin</b> · biomasse "+fmt(w.bio)+" · vos survivants peuvent porter "+fmt(cap0)+(m.lootPct?" · bonus +"+Math.round(m.lootPct*100)+" %":"")+". L’organisme est dévoré et disparaît de la carte.");

          const per=10*(1+mods().predPct)*mt.f,adv=huntAdvice(n0,w,hp,M.hero),R=(v,bad)=>bad?'<b class="neg">'+v+"</b>":"<b>"+v+"</b>";

function buildChoices(){
  const out=[];const push=(ref,u)=>{if(u&&!upgradeBlock(u))out.push({ref,name:u.name+" → niv. "+(u.level+1),cost:u.cost});};

  const seen={};S.fields.forEach((f,i)=>{const key=f.k+":"+f.l;if(seen[key])return;seen[key]=1;push("field:"+i,upgradeInfo("field:"+i));});
  for(const k in BLD){if(k==="noyau"||S.slots.some(s=>s&&s.k===k)||newBlock(k))continue;const i=S.slots.findIndex((s,j)=>!s&&slotOpen(j));if(i>=0)out.push({ref:"slot:"+i,name:BLD[k].name+" (nouveau)",cost:bldCost(k,0),k});}

}

function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
const FORM_PAL={"Larve":["#b9a7f0","#ddd2ff","#7a6ab0"],"Araignée":["#4a3a5c","#7a6a9c","#2a1f38"],"Grenouille venimeuse":["#3cb043","#7be07f","#1f6a24"],"Serpent":["#8bc34a","#c5e1a5","#4a7a2a"],"Scorpion":["#c98a2e","#e8b866","#7a4f16"],"Fourmi soldat":["#a83a2a","#d8664f","#5a1a10"],"Crabe":["#e0602a","#ff9a5c","#8a3410"],"Mante":["#6fbf3b","#a5e07a","#3a7a1a"],"Pieuvre à bec":["#b04a8a","#e07ab8","#6a1a50"],"Homard":["#c0392b","#e8705f","#6e1a12"],"Lucane":["#5a3a22","#8a6a42","#2a1a0a"]};
function heroGrid(formOverride){
  const N=24,G=[];for(let y=0;y<N;y++)G.push(new Array(N).fill(null));
  const set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<N&&y<N)G[y][x]=c;};
  const line=(x0,y0,x1,y1,c,w)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;set(x,y,c);if(w)set(x+1,y,c);}};

    case "Grenouille venimeuse":ell(5,18,3,2,d);ell(19,18,3,2,d);ell(12,15,7,5,b);ell(12,10,6,3.5,b);ell(8,7,1.8,1.8,l);ell(16,7,1.8,1.8,l);eye(8,6);eye(16,6);line(9,12,15,12,d);sym([[7,17],[5,21],[3,21]],l);[[10,15],[14,16],[12,18],[9,18],[15,13]].forEach(p=>set(p[0],p[1],"#ffe07a"));break;
    case "Serpent":{const pts=[[3,21],[7,22],[11,21],[14,18],[13,15],[9,13],[8,10],[10,7],[14,6]];path(pts,b,1);pts.forEach((p,i)=>{if(i%2)set(p[0],p[1]+1,d);});ell(16,6,2.6,2,l);set(17,5,"#ffffff");set(17,6,"#111111");set(16,8,W2);set(19,6,R);set(20,5,R);set(20,7,R);break;}
    case "Scorpion":sym([[10,10],[7,8],[5,5]],b,1);[[4,3],[5,3],[3,4],[3,5],[6,4]].forEach(p=>{set(p[0],p[1],l);set(24-p[0],p[1],l);});for(let i=0;i<3;i++)sym([[10,13+i*2],[6,14+i*3]],d);ell(12,15,3.5,5,b);[12,14,16,18].forEach(y=>line(9,y,15,y,d));path([[12,20],[13,22],[16,22],[19,20],[20,16],[19,12],[17,10]],b,1);set(16,9,V);set(15,9,R);eye(11,10);eye(13,10);break;
    case "Fourmi soldat":sym([[10,4],[8,1]],d);ell(12,6,3.2,2.6,b);sym([[10,8],[8,10],[9,11]],W2);eye(11,5);eye(13,5);ell(12,11,1.8,2,b);[[[11,11],[6,9],[4,12]],[[11,12],[5,13],[3,16]],[[11,13],[6,17],[5,21]]].forEach(p=>sym(p,d));ell(12,17,3.6,4.2,l);line(10,17,14,17,d);break;
    case "Crabe":sym([[10,9],[10,6]],d);eye(10,5);eye(14,5);sym([[6,12],[4,8]],b,1);[[2,4],[3,4],[4,4],[5,5],[2,5],[2,6],[3,7],[5,7]].forEach(p=>{set(p[0],p[1],l);set(24-p[0],p[1],l);});[[[5,15],[1,17]],[[5,16],[2,20]],[[6,17],[4,22]]].forEach(p=>sym(p,d));ell(12,14,8,4.5,b);line(7,13,17,13,l);break;
    case "Mante":line(11,3,13,3,b);line(10,4,14,4,b);set(10,4,"#ffffff");set(14,4,"#ffffff");sym([[11,2],[9,0]],d);line(12,5,12,11,b,1);sym([[11,7],[7,9],[8,5]],l);set(7,7,d);set(17,7,d);sym([[11,11],[6,15],[5,21]],d);sym([[11,13],[7,19]],d);ell(12,16,2.6,5,b);line(12,13,12,20,d);break;
    case "Pieuvre à bec":[6,8,10,14,16,18].forEach((x,i)=>{path([[x,12],[x+(i<3?-1:1),16],[x+(i<3?0:0),19],[x+(i<3?-2:2),21]],i%2?b:d,0);});ell(12,8,6,6,b);ell(10,5,2,1.5,l);eye(9,9);eye(15,9);set(12,13,W2);set(12,12,W2);break;
    case "Homard":sym([[11,7],[6,0]],d);sym([[10,10],[6,9]],b,1);ell(4,6,2.5,3.5,b);ell(20,6,2.5,3.5,b);line(4,3,4,6,"#06111a");line(20,3,20,6,"#06111a");set(3,5,l);set(19,5,l);[11,12,13].forEach(y=>sym([[10,y],[6,y+3]],d));ell(12,10,3,3,b);eye(11,8);eye(13,8);[[14,5,b],[16,4,l],[18,4,b],[20,3,l]].forEach(r=>line(12-Math.floor(r[1]/2),r[0],12+Math.floor(r[1]/2),r[0],r[2]));[[15,b],[17,l],[19,b]].forEach(r=>line(10,r[0],14,r[0],r[1]));line(9,22,15,22,l);line(10,21,14,21,b);break;
    case "Lucane":sym([[10,7],[7,4],[7,1]],l,0);sym([[8,4],[9,3]],l);[[[8,12],[4,10],[2,13]],[[8,15],[3,16],[2,20]],[[9,18],[5,21],[4,23]]].forEach(p=>sym(p,d));ell(12,15,5,6,b);line(12,10,12,21,d);ell(12,8,3,2,b);eye(11,8);eye(13,8);set(10,13,l);set(14,13,l);break;
  }
  if(!formOverride&&form!=="Larve"&&S&&S.hero){if(traitLevel("venin")>=6)[[2,22],[21,22]].forEach(p=>set(p[0],p[1],V));if(traitLevel("carapace")>=6)for(let x=0;x<N;x++)if(G[23-2]&&G[21][x]===b)set(x,21,d);}

  return O;
}

function tileTip(x,y){
  const T=S.tiles[y*W+x],d=dist(x,y);
  if(!inWorld(x,y))return "<b>Roche</b>Le bord du monde.";
  if(isLand(x,y))return "<b>Terre ferme</b>Le but final : aucune cellule ne peut encore y vivre.";
  if(d<0.5)return "<b>Votre cellule</b>Vision "+visR()+" cases.";
  const vis=isVis(x,y);let t="<b>Case "+x+","+y+"</b>";

  else{
    if(T.w)t+=WILD_NAME[T.w.type]+" ("+TYPES[T.w.type].name+")<br>Robustesse "+T.w.def+" · votre meilleure voie : "+matchup(T.w.type).lbl+"<br>";
    if(T.k){const amt=vis?T.a:T.m;t+=(T.rich?"Source hydrothermale · ":"")+RES_NAME[T.k]+" "+fmt(amt)+(vis?"":" (souvenir)")+"<br>";}

  }

}
