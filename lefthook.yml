# Crochets locaux : les mêmes vérifications que la CI. Installer avec `pnpm hooks`.
pre-commit:
  commands:
    format:
      glob: "*.{ts,tsx,js,cjs,json,md,yml,yaml,css,html}"
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint --max-warnings 0 {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    check:
      run: pnpm check
